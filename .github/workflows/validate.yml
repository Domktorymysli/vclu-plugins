name: Validate Plugins

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugins.json
        run: |
          if [ ! -f "plugins.json" ]; then
            echo "ERROR: Missing plugins.json in root"
            exit 1
          fi

          if ! jq . plugins.json > /dev/null 2>&1; then
            echo "ERROR: Invalid JSON in plugins.json"
            exit 1
          fi

          echo "OK: plugins.json is valid"

      - name: Validate plugin manifests
        run: |
          for dir in plugins/*/; do
            echo "Validating $dir"

            # Check plugin.json exists
            if [ ! -f "$dir/plugin.json" ]; then
              echo "ERROR: Missing plugin.json in $dir"
              exit 1
            fi

            # Validate JSON syntax
            if ! jq . "$dir/plugin.json" > /dev/null 2>&1; then
              echo "ERROR: Invalid JSON in $dir/plugin.json"
              exit 1
            fi

            # Check required fields
            if ! jq -e '.id and .name and .version' "$dir/plugin.json" > /dev/null; then
              echo "ERROR: Missing required fields (id, name, version) in $dir/plugin.json"
              exit 1
            fi

            # Plugin API 2, and its permissions declared with known keys only (an empty object grants none)
            # vclu reads api as an integer and permissions as booleans: 2.0 or "yes" would not load
            if ! python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); sys.exit(0 if type(m.get("api")) is int and m["api"] == 2 else 1)' "$dir/plugin.json"; then
              echo "ERROR: $dir/plugin.json needs \"api\": 2"
              exit 1
            fi
            if ! jq -e '(.permissions | type) == "object" and ((.permissions | keys) - ["internet","lan","udp","tcp","mqtt","modbus","grenton_raw","tftp","serial"] | length) == 0 and all(.permissions | to_entries[]; .key == "internet" or (.value | type) == "boolean")' "$dir/plugin.json" > /dev/null; then
              echo "ERROR: $dir/plugin.json needs \"permissions\": {} with only internet (a list of hosts) and lan, udp, tcp, mqtt, modbus, grenton_raw, tftp, serial set to true or false"
              exit 1
            fi
            # internet: hosts as vclu reads them, "*" only with "internetWhy", every host the Lua calls listed
            if ! python3 .github/scripts/check-internet.py "$dir"; then
              exit 1
            fi

            # vclu refuses the whole manifest when a docs entry is not {title, file}: the plugin does not load
            if ! jq -e '(.docs // []) | all(type == "object" and (.file | type) == "string")' "$dir/plugin.json" > /dev/null; then
              echo "ERROR: $dir/plugin.json: each docs entry is {\"title\": ..., \"file\": ...}"
              exit 1
            fi
            # a wizard form is downloaded only when it is in files
            if ! jq -e 'if .form then ((.files // ["init.lua"]) | index($f)) != null else true end' --arg f "$(jq -r '.form // ""' "$dir/plugin.json")" "$dir/plugin.json" > /dev/null; then
              echo "ERROR: $dir/plugin.json: the form file is not in files"
              exit 1
            fi
            # dashboards as vclu reads them, or it refuses the manifest: up to 8, ids [a-z0-9_] unique,
            # a name as text or {pl, en} up to 60 characters, a description up to 300
            if ! python3 .github/scripts/check-dashboards.py "$dir/plugin.json"; then
              exit 1
            fi
            # udp broadcast ports as vclu reads them: whole ports, up to 8, never 1234 or 69, only with "udp": true
            if ! python3 .github/scripts/check-udp.py "$dir/plugin.json"; then
              exit 1
            fi
            # tcp ports as vclu reads them: required with "tcp": true, up to 8, none of another permission
            if ! python3 .github/scripts/check-tcp.py "$dir/plugin.json"; then
              exit 1
            fi
            # WebSocket ports on the local network as vclu reads them: up to 8, none of another permission, with lan
            if ! python3 .github/scripts/check-websocket.py "$dir/plugin.json"; then
              exit 1
            fi
            # Check init.lua exists
            if [ ! -f "$dir/init.lua" ]; then
              echo "ERROR: Missing init.lua in $dir"
              exit 1
            fi

            # Verify plugin is listed in plugins.json
            plugin_id=$(jq -r '.id' "$dir/plugin.json")
            if ! jq -e ".plugins[] | select(.id == \"$plugin_id\")" plugins.json > /dev/null; then
              echo "WARNING: Plugin $plugin_id not listed in plugins.json"
            fi

            echo "OK: $dir"
          done

          echo "All plugins validated successfully!"

      # Syntax checking is luac, not lua. The old step called `lua -p`, which is
      # not an option, and swallowed the failure with `|| true`.
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Lua syntax check
        run: |
          rc=0
          for file in plugins/*/*.lua test/*.lua; do
            [ -f "$file" ] || continue
            echo "Checking $file"
            if ! luac5.4 -p "$file"; then
              echo "ERROR: syntax error in $file"
              rc=1
            fi
          done
          exit $rc

      - name: Plugin tests
        run: |
          rc=0
          found=0
          for file in plugins/*/test.lua test/*_test.lua; do
            [ -f "$file" ] || continue
            found=1
            echo "=== $file"
            if ! lua5.4 "$file"; then
              rc=1
            fi
          done
          if [ "$found" = "0" ]; then
            echo "No plugin tests found"
          fi
          exit $rc
